spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNoExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.driver

  jpa:
    hibernate:
      ddl-auto: update
    show:sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MYSQLDialect


  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafta.common.serialization.StringSerializer
      value-serializer: org.springframework.kafta.support.serializer.JsonSerializer

server:
  port: 8083

# Razorpay Configuration

razorpay:
  key-id: rzp_XXXXXX
  key-secret:
  webhook-secret:

management:
  endpoints:
    web:
      exposure:
        include: health,info

